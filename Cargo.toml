[package]
name = "ovr_overlay"
version = "0.0.0"

description = "Rust bindings for OpenVR overlays"
authors.workspace = true
license.workspace = true
repository.workspace = true

edition.workspace = true
rust-version.workspace = true # Rust security fix

[features]
default = [
    "ovr_applications",
    "ovr_chaperone_setup",
    "ovr_input",
    "ovr_settings",
    "ovr_system",
]
ovr_applications = []
ovr_chaperone_setup = []
ovr_input = []
ovr_system = []
ovr_settings = []

[dependencies]
ovr_overlay_sys = { version = "=0.0.0", path = "sys" }
lazy_static = "1.5.0"
thiserror = "2.0.20"
derive_more = { version = "2.1.1", features = ["from", "into"] }
log = "0.4.33"
nalgebra = { version = "0.35.0", optional = true }
slice-of-array = "0.3.2"
enumset = "1.1.14"
byteorder = "1.5.0"


[workspace]
members = ["sys"]
resolver = "2"

# Inherited by crates
[workspace.package]
authors = ["Ryan Butler <thebutlah@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheButlah/ovr_overlay"

edition = "2021"
rust-version = "1.93.0" # `slice::as_array` (src/system.rs); deps need at most 1.89 (nalgebra 0.35)
